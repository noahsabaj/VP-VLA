name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.15.8
      # Whole repo: only errors that break at runtime (syntax errors, undefined names).
      # The full style ruleset in pyproject.toml reports ~2,000 findings on existing code, so it is not enforced there yet.
      - name: Ruff (runtime errors, whole repo)
        run: ruff check . --select E9,F63,F7,F82 --output-format github
      # Tests: full pyproject.toml ruleset plus formatting.
      - name: Ruff (full rules, tests)
        run: |
          ruff check tests --output-format github
          ruff format --check tests

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # CPU-only torch wheels; versions match requirements.txt. The test stubs the VLM, so nothing else is downloaded.
      - name: Install dependencies
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.57.0 accelerate==1.5.2 numpy==1.26.4 pillow omegaconf rich pytest
      - name: Run smoke tests
        run: pytest -v
